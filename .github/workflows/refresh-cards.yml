name: Refresh card data

on:
  schedule:
    - cron: "0 */1 * * *"     # every 1 hours (UTC)
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the published sheet CSV
        env:
          CSV_URL: "PASTE-YOUR-PUBLISHED-CSV-URL-HERE"
        run: |
          curl -sSL --fail --retry 3 --retry-delay 5 "$CSV_URL" -o cards.csv

      - name: Build cards.json
        run: python3 build_cards.py

      - name: Commit if the data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards.json
          if git diff --cached --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "Auto-refresh card data [skip ci]"
            git push
          fi
